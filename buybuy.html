<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BuyBuy App</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .comparing { border: 3px solid #f97316 !important; }
        .ghost { opacity: 0.4; background: #e2e8f0; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

<div class="p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">🛒 BuyBuy 清單</h1>
        <button onclick="addNewItem()" class="bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg">+ 新增</button>
    </div>

    <div id="productList" class="space-y-4">
        </div>
</div>

<div id="compareBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 hidden flex justify-between items-center shadow-2xl">
    <p id="compareText" class="font-medium text-orange-600 text-sm">已選擇 1 個商品...</p>
    <button onclick="openCompareModal()" class="bg-orange-500 text-white px-6 py-2 rounded-lg">開始比較</button>
</div>

<div id="compareModal" class="fixed inset-0 bg-black/80 hidden z-50 p-4 flex items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-2xl p-6 relative">
        <button onclick="closeCompareModal()" class="absolute top-4 right-4 text-2xl">×</button>
        <h2 class="text-xl font-bold mb-6 text-center">商品對決</h2>
        <div id="compareContent" class="flex gap-4">
            </div>
    </div>
</div>

<script>
    let items = JSON.parse(localStorage.getItem('buybuy_items')) || [];
    let selectedIds = [];

    // 1. 初始化拖拽功能 (針對手機優化)
    const el = document.getElementById('productList');
    Sortable.create(el, {
        animation: 150,
        ghostClass: 'ghost',
        onEnd: function() {
            // 重新排序後儲存 (此處簡化處理)
            console.log("排序已更改");
        }
    });

    // 2. 新增商品
    function addNewItem() {
        const name = prompt("請輸入商品名稱：") || "新商品";
        const price = prompt("請輸入價格：") || "0";
        const newItem = {
            id: Date.now().toString(),
            name: name,
            price: price,
            date: new Date().toLocaleDateString(),
            tags: ["待買"],
            img: "https://via.placeholder.com/150/e2e8f0/64748b?text=Product"
        };
        items.push(newItem);
        saveAndRender();
    }

    // 3. 渲染列表
    function render() {
        const list = document.getElementById('productList');
        list.innerHTML = items.map(item => `
            <div class="bg-white p-4 rounded-xl shadow-sm flex items-center gap-4 border-2 border-transparent ${selectedIds.includes(item.id) ? 'comparing' : ''}" 
                 onclick="toggleSelect('${item.id}')">
                <img src="${item.img}" class="w-20 h-20 rounded-lg object-cover bg-gray-100">
                <div class="flex-1">
                    <h3 class="font-bold text-lg">${item.name}</h3>
                    <p class="text-red-500 font-semibold">$${item.price}</p>
                    <div class="flex gap-1 mt-1">
                        ${item.tags.map(t => `<span class="text-[10px] bg-gray-200 px-2 py-0.5 rounded">${t}</span>`).join('')}
                    </div>
                </div>
            </div>
        `).join('');

        const bar = document.getElementById('compareBar');
        if (selectedIds.length > 0) {
            bar.classList.remove('hidden');
            document.getElementById('compareText').innerText = `已選擇 ${selectedIds.length} / 2 個商品`;
        } else {
            bar.classList.add('hidden');
        }
    }

    // 4. 選擇比較功能
    function toggleSelect(id) {
        if (selectedIds.includes(id)) {
            selectedIds = selectedIds.filter(i => i !== id);
        } else {
            if (selectedIds.length < 2) {
                selectedIds.push(id);
            } else {
                alert("最多選兩個比較");
            }
        }
        render();
    }

    function openCompareModal() {
        if (selectedIds.length < 2) return;
        const compareContent = document.getElementById('compareContent');
        const selectedItems = items.filter(i => selectedIds.includes(i.id));
        
        compareContent.innerHTML = selectedItems.map(i => `
            <div class="flex-1 text-center border p-4 rounded-xl">
                <img src="${i.img}" class="mx-auto mb-2 w-24 h-24 object-cover">
                <p class="font-bold">${i.name}</p>
                <p class="text-red-500 text-xl font-bold">$${i.price}</p>
                <p class="text-xs text-gray-400 mt-2">記錄日: ${i.date}</p>
            </div>
        `).join('<div class="flex items-center font-bold text-gray-400">VS</div>');
        
        document.getElementById('compareModal').classList.remove('hidden');
    }

    function closeCompareModal() {
        document.getElementById('compareModal').classList.add('hidden');
        selectedIds = [];
        render();
    }

    function saveAndRender() {
        localStorage.setItem('buybuy_items', JSON.stringify(items));
        render();
    }

    render();
</script>

</body>
</html>
