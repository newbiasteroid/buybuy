<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BuyBuy App v2</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .comparing { border: 4px solid #f97316 !important; background-color: #fff7ed; }
        .ghost { opacity: 0.2; background: #cbd5e1; }
        /* 防止手機長按選中文字，影響拖拽 */
        * { -webkit-touch-callout: none; -webkit-user-select: none; }
        input, textarea { -webkit-user-select: text; }
    </style>
</head>
<body class="bg-slate-50 pb-24">

<div class="p-4">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-extrabold text-slate-800">BuyBuy</h1>
        <button onclick="triggerNewItem()" class="bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg text-2xl">+</button>
    </header>

    <div id="productList" class="grid grid-cols-1 gap-4">
        </div>
</div>

<div id="compareBar" class="fixed bottom-6 left-4 right-4 bg-white/90 backdrop-blur-md border shadow-2xl rounded-2xl p-4 hidden flex justify-between items-center z-40">
    <span id="compareCount" class="font-bold text-orange-600">已選 0 / 2</span>
    <button onclick="openCompareModal()" class="bg-orange-500 text-white px-6 py-2 rounded-xl font-bold">VS 立即比較</button>
</div>

<div id="editModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between mb-4">
            <h2 class="text-xl font-bold">商品詳情</h2>
            <button onclick="closeEdit()" class="text-gray-400 text-2xl">&times;</button>
        </div>
        <div class="space-y-4">
            <div><label class="text-sm text-gray-500">商品名稱</label><input id="editName" type="text" class="w-full border-b p-2 outline-none focus:border-indigo-500"></div>
            <div class="flex gap-4">
                <div class="flex-1"><label class="text-sm text-gray-500">價錢</label><input id="editPrice" type="number" class="w-full border-b p-2 outline-none"></div>
                <div class="flex-1"><label class="text-sm text-gray-500">Tag (用逗號隔開)</label><input id="editTags" type="text" class="w-full border-b p-2 outline-none"></div>
            </div>
            <div><label class="text-sm text-gray-500">備註/日期</label><textarea id="editNote" class="w-full border-b p-2 outline-none"></textarea></div>
            <button onclick="saveEdit()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">儲存修改</button>
            <button onclick="deleteItem()"
