<button onclick="triggerNewItem()" id="addBtn" class="bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg text-2xl flex items-center justify-center">
    <span>+</span>
</button>

<script>
    // 在最前面加上這段除錯檢查
    window.onerror = function(msg, url, linenumber) {
        alert('錯誤訊息: ' + msg + '\n行號: ' + linenumber);
        return true;
    };

    let items = JSON.parse(localStorage.getItem('buybuy_v2')) || [];
    let selectedIds = [];
    let currentEditId = null;

    const listEl = document.getElementById('productList');
    const camInput = document.getElementById('cameraInput');

    // 重新編寫的新增函數，增加穩定性
    function triggerNewItem() {
        console.log("按鈕被點擊了");
        try {
            const fileInput = document.getElementById('cameraInput');
            if (!fileInput) {
                alert("找不到相機輸入元件");
                return;
            }
            fileInput.click();
        } catch (err) {
            alert("觸發失敗: " + err);
        }
    }

    // 處理檔案選取與相機拍照
    document.getElementById('cameraInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // 顯示讀取中，避免大圖片造成當機感
        const originalText = document.getElementById('addBtn').innerHTML;
        document.getElementById('addBtn').innerHTML = "⏳";

        const reader = new FileReader();
        reader.onload = function(event) {
            const newItem = {
                id: Date.now().toString(),
                name: "新商品 " + (items.length + 1),
                price: "0",
                date: new Date().toLocaleDateString(),
                tags: ["清單"],
                note: "",
                img: event.target.result // Base64 格式
            };
            
            items.unshift(newItem);
            save();
            render();
            document.getElementById('addBtn').innerHTML = originalText;
            
            // 自動開啟編輯視窗
            setTimeout(() => openEdit(newItem.id), 300);
        };
        
        reader.onerror = function() {
            alert("讀取圖片失敗");
        };
        
        reader.readAsDataURL(file);
    };

    // ... 其餘的 render, save, openEdit 等函數保持不變 ...
</script>
