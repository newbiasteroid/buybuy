<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BuyBuy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --card: #FFFFFF;
    --ink: #1A1208;
    --ink2: #5C4F38;
    --ink3: #A09078;
    --accent: #D4541A;
    --accent2: #F2A65A;
    --green: #2D7A4F;
    --border: #E8E0D0;
    --shadow: 0 2px 16px rgba(26,18,8,0.10);
    --shadow-lg: 0 8px 40px rgba(26,18,8,0.16);
    --r: 16px;
    --r-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: -1px;
  }
  .logo span { color: var(--ink); }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  .btn-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: background 0.15s;
    color: var(--ink);
  }
  .btn-icon:active { background: var(--border); }
  .btn-icon.compare-active { background: var(--accent); color: white; }

  /* MAIN */
  .main { padding: 20px 16px 100px; }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 14px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  /* PRODUCT CARD */
  .card {
    background: var(--card);
    border-radius: var(--r);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative;
    border: 1.5px solid transparent;
    user-select: none;
  }
  .card:active { transform: scale(0.97); }
  .card.selected-compare {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,84,26,0.18), var(--shadow);
  }
  .card.dragging { opacity: 0.5; transform: scale(0.95); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--bg);
  }
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    background: linear-gradient(135deg, #F5F0E8 0%, #EDE5D4 100%);
  }
  .card-body { padding: 12px; }
  .card-name {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.3;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-price {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }
  .card-price span { font-size: 12px; font-weight: 400; color: var(--ink3); font-family: 'DM Sans', sans-serif; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tag {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--bg);
    color: var(--ink2);
    border: 1px solid var(--border);
  }
  .compare-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--accent);
    color: white;
    width: 24px; height: 24px;
    border-radius: 50%;
    font-size: 13px;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(212,84,26,0.3);
  }
  .card.selected-compare .compare-badge { display: flex; }

  /* EMPTY STATE */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
  }
  .empty-icon { font-size: 56px; margin-bottom: 16px; }
  .empty-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .empty-sub { color: var(--ink3); font-size: 14px; }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 28px; right: 20px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(212,84,26,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    z-index: 99;
  }
  .fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(212,84,26,0.3); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,18,8,0.5);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    padding: 0 0 40px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .modal-header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
  }
  .modal-close {
    background: var(--bg);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink2);
  }

  .form { padding: 20px; display: flex; flex-direction: column; gap: 18px; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink3); }
  .form-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-input:focus { border-color: var(--accent); }
  textarea.form-input { resize: vertical; min-height: 80px; }

  /* IMAGE PICKER */
  .img-picker { display: flex; flex-direction: column; gap: 12px; }
  .img-preview-wrap {
    width: 100%;
    aspect-ratio: 2/1;
    border-radius: var(--r-sm);
    background: var(--bg);
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .img-preview { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-preview-placeholder { font-size: 40px; }
  .img-preview-icon-large { font-size: 64px; }

  .img-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .img-option-btn {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: border-color 0.15s, background 0.15s;
  }
  .img-option-btn:active { background: var(--border); }
  .img-option-btn span:first-child { font-size: 24px; }

  /* EMOJI PICKER */
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .emoji-btn {
    aspect-ratio: 1;
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--bg);
    font-size: 28px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, transform 0.1s;
  }
  .emoji-btn:active { transform: scale(0.9); }
  .emoji-btn.selected { border-color: var(--accent); background: rgba(212,84,26,0.08); }

  /* TAG INPUT */
  .tag-input-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    min-height: 46px;
    align-items: center;
    cursor: text;
  }
  .tag-input-wrap:focus-within { border-color: var(--accent); }
  .tag-pill {
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; gap: 4px;
  }
  .tag-pill button { background: none; border: none; color: white; font-size: 14px; cursor: pointer; line-height: 1; padding: 0 0 0 2px; }
  .tag-input-field {
    background: none;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    min-width: 60px;
    flex: 1;
  }

  /* DETAIL MODAL */
  .detail-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
  }
  .detail-img-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px;
    background: linear-gradient(135deg, #F5F0E8, #EDE5D4);
  }
  .detail-body { padding: 20px; }
  .detail-name {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .detail-date { font-size: 12px; color: var(--ink3); margin-bottom: 16px; }
  .detail-price {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .detail-section { margin-bottom: 16px; }
  .detail-section-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; }
  .detail-desc { font-size: 14px; color: var(--ink2); line-height: 1.6; }
  .detail-url { font-size: 13px; color: var(--accent); text-decoration: none; word-break: break-all; }
  .detail-actions { display: flex; gap: 10px; padding: 0 20px 0; }
  .btn-primary {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--r-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-secondary {
    flex: 1;
    padding: 14px;
    background: var(--bg);
    color: var(--ink);
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-danger {
    flex: 1;
    padding: 14px;
    background: #FFF0EE;
    color: #C0392B;
    border: 1.5px solid #FADADD;
    border-radius: var(--r-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  /* COMPARE PANEL */
  .compare-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 2px solid var(--accent);
    padding: 12px 16px 28px;
    z-index: 98;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -4px 30px rgba(212,84,26,0.12);
  }
  .compare-bar.visible { transform: translateY(0); }
  .compare-bar-title { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .compare-slots { display: flex; gap: 10px; margin-bottom: 12px; }
  .compare-slot {
    flex: 1;
    height: 60px;
    background: var(--bg);
    border: 2px dashed var(--border);
    border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: var(--ink3);
    font-weight: 500;
    overflow: hidden;
    position: relative;
  }
  .compare-slot.filled {
    border-style: solid;
    border-color: var(--accent);
    background: rgba(212,84,26,0.04);
  }
  .compare-slot-content { display: flex; align-items: center; gap: 8px; padding: 0 10px; width: 100%; }
  .compare-slot-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; }
  .compare-slot-img img { width: 100%; height: 100%; object-fit: cover; }
  .compare-slot-info { flex: 1; min-width: 0; }
  .compare-slot-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compare-slot-price { font-size: 12px; color: var(--accent); font-weight: 600; }
  .compare-slot-remove { background: none; border: none; font-size: 16px; color: var(--ink3); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .compare-go-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--r-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s;
  }
  .compare-go-btn.ready { opacity: 1; }

  /* COMPARE VIEW MODAL */
  .compare-view { padding: 0 16px 20px; }
  .compare-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .compare-col { display: flex; flex-direction: column; gap: 0; }
  .compare-col-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
  }
  .compare-col-img-placeholder {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    background: linear-gradient(135deg, #F5F0E8, #EDE5D4);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
  }
  .compare-col-body {
    background: var(--card);
    border-radius: 0 0 var(--r-sm) var(--r-sm);
    padding: 12px;
    flex: 1;
    box-shadow: var(--shadow);
  }
  .compare-col-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .compare-col-price { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 900; color: var(--accent); margin-bottom: 8px; }
  .compare-row { margin-bottom: 8px; }
  .compare-row-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink3); margin-bottom: 2px; }
  .compare-row-val { font-size: 12px; color: var(--ink2); line-height: 1.4; }
  .compare-winner {
    background: var(--green);
    color: white;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 6px;
  }

  /* CONFIRM DIALOG */
  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(26,18,8,0.6);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .confirm-overlay.open { opacity: 1; pointer-events: all; }
  .confirm-box {
    background: var(--surface);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.2s;
  }
  .confirm-overlay.open .confirm-box { transform: scale(1); }
  .confirm-icon { font-size: 44px; margin-bottom: 12px; }
  .confirm-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .confirm-desc { font-size: 14px; color: var(--ink3); margin-bottom: 24px; }
  .confirm-actions { display: flex; gap: 10px; }

  /* TOAST */
  .toast {
    position: fixed;
    top: 76px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 400;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">Buy<span>Buy</span></div>
  <div class="header-actions">
    <button class="btn-icon" id="compareToggleBtn" title="比較模式" onclick="toggleCompareMode()">⚖️</button>
  </div>
</header>

<!-- MAIN -->
<main class="main">
  <div class="section-title">我的心願單</div>
  <div class="grid" id="productGrid"></div>
</main>

<!-- FAB -->
<button class="fab" onclick="openAddModal()">＋</button>

<!-- COMPARE BAR -->
<div class="compare-bar" id="compareBar">
  <div class="compare-bar-title">⚖️ 比較模式 — 點選商品加入</div>
  <div class="compare-slots">
    <div class="compare-slot" id="slot0"><span>點選商品 1</span></div>
    <div class="compare-slot" id="slot1"><span>點選商品 2</span></div>
  </div>
  <button class="compare-go-btn" id="compareGoBtn" onclick="openCompareView()">開始比較</button>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="formModalTitle">新增商品</div>
      <button class="modal-close" onclick="closeFormModal()">✕</button>
    </div>
    <div class="form">
      <input type="hidden" id="editId">

      <!-- IMAGE -->
      <div class="form-group">
        <div class="form-label">商品圖片</div>
        <div class="img-picker">
          <div class="img-preview-wrap" id="imgPreviewWrap">
            <div class="img-preview-placeholder" id="imgPlaceholder">📦</div>
          </div>
          <div class="img-options">
            <button class="img-option-btn" onclick="document.getElementById('fileInput').click()">
              <span>📁</span>
              <span>上傳圖片</span>
            </button>
            <button class="img-option-btn" onclick="openEmojiPicker()">
              <span>😊</span>
              <span>選擇圖示</span>
            </button>
          </div>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
        </div>
      </div>

      <!-- EMOJI PICKER (hidden by default) -->
      <div class="form-group" id="emojiPickerGroup" style="display:none">
        <div class="form-label">選擇圖示</div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <!-- NAME -->
      <div class="form-group">
        <div class="form-label">商品名稱 *</div>
        <input class="form-input" type="text" id="inputName" placeholder="例如：AirPods Pro" maxlength="50">
      </div>

      <!-- PRICE -->
      <div class="form-group">
        <div class="form-label">價格</div>
        <input class="form-input" type="number" id="inputPrice" placeholder="0" min="0">
      </div>

      <!-- URL -->
      <div class="form-group">
        <div class="form-label">商品連結</div>
        <input class="form-input" type="url" id="inputUrl" placeholder="https://...">
      </div>

      <!-- TAGS -->
      <div class="form-group">
        <div class="form-label">標籤（輸入後按 Enter）</div>
        <div class="tag-input-wrap" id="tagWrap" onclick="document.getElementById('tagField').focus()">
          <input class="tag-input-field" id="tagField" placeholder="加入標籤..." onkeydown="handleTagInput(event)">
        </div>
      </div>

      <!-- NOTE -->
      <div class="form-group">
        <div class="form-label">備註</div>
        <textarea class="form-input" id="inputNote" placeholder="價格比較、購買原因..."></textarea>
      </div>

      <button class="btn-primary" onclick="saveProduct()">儲存商品</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="detailContent"></div>
    <div class="detail-actions" id="detailActions"></div>
  </div>
</div>

<!-- COMPARE VIEW MODAL -->
<div class="modal-overlay" id="compareModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">比較</div>
      <button class="modal-close" onclick="closeModal('compareModal')">✕</button>
    </div>
    <div class="compare-view" id="compareContent"></div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">確定刪除？</div>
    <div class="confirm-desc">這個商品將會被永久刪除</div>
    <div class="confirm-actions">
      <button class="btn-secondary" onclick="closeConfirm()">取消</button>
      <button class="btn-danger" id="confirmDeleteBtn">刪除</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'buybuy_products_v1';
let products = [];
let currentTags = [];
let currentImage = null; // {type: 'url'|'emoji', value: '...'}
let compareMode = false;
let compareItems = [null, null];
let pendingDeleteId = null;

const EMOJIS = ['📦','👟','👗','👜','💄','📱','💻','🎧','📷','🎮','🏠','🛋️','🍳','📚','✏️','🎸','🏋️','🚴','✈️','🌸','💍','⌚','🕶️','🎒','🧴','🪴','🧸','🎁','💡','🔧'];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    products = raw ? JSON.parse(raw) : [];
  } catch(e) { products = []; }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('productGrid');
  if (products.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🛍️</div>
        <div class="empty-title">還沒有商品</div>
        <div class="empty-sub">點擊右下角 ＋ 新增第一個商品</div>
      </div>`;
    return;
  }

  grid.innerHTML = products.map((p, i) => {
    const compareIdx = compareItems.indexOf(p.id);
    const isSelected = compareIdx !== -1;
    const imgHTML = buildCardImg(p.image);
    const tagsHTML = (p.tags||[]).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('');
    const priceHTML = p.price ? `<div class="card-price">$${Number(p.price).toLocaleString()}<span> TWD</span></div>` : `<div class="card-price" style="color:var(--ink3);font-size:14px">未設定價格</div>`;
    return `
      <div class="card${isSelected?' selected-compare':''}" 
           id="card-${p.id}"
           onclick="cardClick('${p.id}')"
           draggable="true"
           ondragstart="dragStart(event,'${p.id}')"
           ondragend="dragEnd(event)">
        <div class="compare-badge">${compareIdx+1}</div>
        ${imgHTML}
        <div class="card-body">
          <div class="card-name">${escHtml(p.name)}</div>
          ${priceHTML}
          ${tagsHTML ? `<div class="card-tags">${tagsHTML}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function buildCardImg(image) {
  if (!image) return `<div class="card-img-placeholder">📦</div>`;
  if (image.type === 'emoji') return `<div class="card-img-placeholder">${image.value}</div>`;
  if (image.type === 'url') return `<img class="card-img" src="${image.value}" alt="product" onerror="this.parentNode.innerHTML='<div class=\\'card-img-placeholder\\'>📦</div>'">`;
  return `<div class="card-img-placeholder">📦</div>`;
}

// ── CARD CLICK ────────────────────────────────────────────────────────────────
function cardClick(id) {
  if (compareMode) {
    toggleCompareItem(id);
  } else {
    openDetailModal(id);
  }
}

// ── DETAIL MODAL ──────────────────────────────────────────────────────────────
function openDetailModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  let imgHTML;
  if (!p.image) imgHTML = `<div class="detail-img-placeholder">📦</div>`;
  else if (p.image.type === 'emoji') imgHTML = `<div class="detail-img-placeholder">${p.image.value}</div>`;
  else imgHTML = `<img class="detail-img" src="${p.image.value}" alt="${escHtml(p.name)}" onerror="this.outerHTML='<div class=\\'detail-img-placeholder\\'>📦</div>'">`;

  const tagsHTML = (p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('');
  const dateStr = new Date(p.createdAt).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'});
  const urlHTML = p.url ? `<div class="detail-section"><div class="detail-section-label">購買連結</div><a class="detail-url" href="${escHtml(p.url)}" target="_blank">${escHtml(p.url)}</a></div>` : '';
  const noteHTML = p.note ? `<div class="detail-section"><div class="detail-section-label">備註</div><div class="detail-desc">${escHtml(p.note)}</div></div>` : '';
  const tagsSection = tagsHTML ? `<div class="detail-section"><div class="detail-section-label">標籤</div><div class="card-tags">${tagsHTML}</div></div>` : '';

  document.getElementById('detailContent').innerHTML = `
    ${imgHTML}
    <div class="detail-body">
      <div class="detail-name">${escHtml(p.name)}</div>
      <div class="detail-date">記錄於 ${dateStr}</div>
      ${p.price ? `<div class="detail-price">$${Number(p.price).toLocaleString()} <span style="font-size:16px;font-weight:400;color:var(--ink3)">TWD</span></div>` : ''}
      ${tagsSection}
      ${noteHTML}
      ${urlHTML}
    </div>`;

  document.getElementById('detailActions').innerHTML = `
    <button class="btn-secondary" onclick="closeModal('detailModal');openEditModal('${p.id}')">編輯</button>
    <button class="btn-danger" onclick="confirmDelete('${p.id}')">刪除</button>`;

  openModal('detailModal');
}

// ── ADD / EDIT ────────────────────────────────────────────────────────────────
function openAddModal() {
  document.getElementById('formModalTitle').textContent = '新增商品';
  document.getElementById('editId').value = '';
  document.getElementById('inputName').value = '';
  document.getElementById('inputPrice').value = '';
  document.getElementById('inputUrl').value = '';
  document.getElementById('inputNote').value = '';
  currentTags = [];
  currentImage = null;
  renderTags();
  renderImgPreview();
  document.getElementById('emojiPickerGroup').style.display = 'none';
  renderEmojiGrid();
  openModal('formModal');
}

function openEditModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  closeModal('detailModal');
  document.getElementById('formModalTitle').textContent = '編輯商品';
  document.getElementById('editId').value = id;
  document.getElementById('inputName').value = p.name || '';
  document.getElementById('inputPrice').value = p.price || '';
  document.getElementById('inputUrl').value = p.url || '';
  document.getElementById('inputNote').value = p.note || '';
  currentTags = [...(p.tags||[])];
  currentImage = p.image || null;
  renderTags();
  renderImgPreview();
  document.getElementById('emojiPickerGroup').style.display = 'none';
  renderEmojiGrid();
  openModal('formModal');
}

function saveProduct() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) { showToast('請輸入商品名稱'); document.getElementById('inputName').focus(); return; }

  const id = document.getElementById('editId').value;
  const price = document.getElementById('inputPrice').value;
  const url = document.getElementById('inputUrl').value.trim();
  const note = document.getElementById('inputNote').value.trim();

  if (id) {
    const idx = products.findIndex(x => x.id === id);
    if (idx !== -1) {
      products[idx] = { ...products[idx], name, price: price?Number(price):null, url, note, tags: [...currentTags], image: currentImage };
    }
  } else {
    products.unshift({ id: genId(), name, price: price?Number(price):null, url, note, tags: [...currentTags], image: currentImage, createdAt: Date.now() });
  }

  saveData();
  renderGrid();
  closeFormModal();
  showToast(id ? '已更新商品 ✓' : '已新增商品 ✓');
}

function closeFormModal() {
  closeModal('formModal');
}

// ── IMAGE ─────────────────────────────────────────────────────────────────────
function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImage = { type: 'url', value: ev.target.result };
    renderImgPreview();
    document.getElementById('emojiPickerGroup').style.display = 'none';
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function openEmojiPicker() {
  const grp = document.getElementById('emojiPickerGroup');
  grp.style.display = grp.style.display === 'none' ? 'block' : 'none';
  renderEmojiGrid();
}

function renderEmojiGrid() {
  const grid = document.getElementById('emojiGrid');
  const cur = currentImage?.type === 'emoji' ? currentImage.value : null;
  grid.innerHTML = EMOJIS.map(e => `<button class="emoji-btn${e===cur?' selected':''}" onclick="selectEmoji('${e}')">${e}</button>`).join('');
}

function selectEmoji(emoji) {
  currentImage = { type: 'emoji', value: emoji };
  renderImgPreview();
  renderEmojiGrid();
}

function renderImgPreview() {
  const wrap = document.getElementById('imgPreviewWrap');
  if (!currentImage) {
    wrap.innerHTML = `<div class="img-preview-placeholder" id="imgPlaceholder">📦</div>`;
  } else if (currentImage.type === 'emoji') {
    wrap.innerHTML = `<div class="img-preview-icon-large">${currentImage.value}</div>`;
  } else {
    wrap.innerHTML = `<img class="img-preview" src="${currentImage.value}" alt="preview">`;
  }
}

// ── TAGS ──────────────────────────────────────────────────────────────────────
function handleTagInput(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,/g,'');
    if (val && !currentTags.includes(val) && currentTags.length < 8) {
      currentTags.push(val);
      renderTags();
    }
    e.target.value = '';
  } else if (e.key === 'Backspace' && e.target.value === '' && currentTags.length > 0) {
    currentTags.pop();
    renderTags();
  }
}

function removeTag(tag) {
  currentTags = currentTags.filter(t => t !== tag);
  renderTags();
}

function renderTags() {
  const wrap = document.getElementById('tagWrap');
  const field = document.getElementById('tagField');
  const pills = currentTags.map(t => `<span class="tag-pill">${escHtml(t)}<button onclick="removeTag('${escHtml(t)}')" type="button">×</button></span>`).join('');
  wrap.innerHTML = pills + `<input class="tag-input-field" id="tagField" placeholder="${currentTags.length?'':'加入標籤...'}" onkeydown="handleTagInput(event)">`;
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function confirmDelete(id) {
  pendingDeleteId = id;
  document.getElementById('confirmDeleteBtn').onclick = () => executeDelete(id);
  closeModal('detailModal');
  document.getElementById('confirmOverlay').classList.add('open');
}

function executeDelete(id) {
  products = products.filter(x => x.id !== id);
  compareItems = compareItems.map(c => c === id ? null : c);
  saveData();
  renderGrid();
  updateCompareSlots();
  closeConfirm();
  showToast('已刪除商品');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  pendingDeleteId = null;
}

// ── COMPARE ───────────────────────────────────────────────────────────────────
function toggleCompareMode() {
  compareMode = !compareMode;
  const btn = document.getElementById('compareToggleBtn');
  const bar = document.getElementById('compareBar');
  btn.classList.toggle('compare-active', compareMode);
  bar.classList.toggle('visible', compareMode);
  if (!compareMode) {
    compareItems = [null, null];
    renderGrid();
    updateCompareSlots();
  }
  showToast(compareMode ? '比較模式：點選商品加入' : '已退出比較模式');
}

function toggleCompareItem(id) {
  const idx = compareItems.indexOf(id);
  if (idx !== -1) {
    compareItems[idx] = null;
  } else {
    const emptySlot = compareItems.indexOf(null);
    if (emptySlot === -1) {
      compareItems[0] = compareItems[1];
      compareItems[1] = id;
    } else {
      compareItems[emptySlot] = id;
    }
  }
  renderGrid();
  updateCompareSlots();
}

function updateCompareSlots() {
  for (let i = 0; i < 2; i++) {
    const slot = document.getElementById(`slot${i}`);
    const id = compareItems[i];
    if (!id) {
      slot.className = 'compare-slot';
      slot.innerHTML = `<span>點選商品 ${i+1}</span>`;
    } else {
      const p = products.find(x => x.id === id);
      if (!p) { compareItems[i] = null; slot.className = 'compare-slot'; slot.innerHTML = `<span>點選商品 ${i+1}</span>`; continue; }
      let imgEl;
      if (!p.image) imgEl = `<div class="compare-slot-img">📦</div>`;
      else if (p.image.type === 'emoji') imgEl = `<div class="compare-slot-img">${p.image.value}</div>`;
      else imgEl = `<div class="compare-slot-img"><img src="${p.image.value}" alt=""></div>`;
      slot.className = 'compare-slot filled';
      slot.innerHTML = `<div class="compare-slot-content">${imgEl}<div class="compare-slot-info"><div class="compare-slot-name">${escHtml(p.name)}</div>${p.price?`<div class="compare-slot-price">$${Number(p.price).toLocaleString()}</div>`:''}</div><button class="compare-slot-remove" onclick="toggleCompareItem('${id}')">✕</button></div>`;
    }
  }
  const goBtn = document.getElementById('compareGoBtn');
  goBtn.classList.toggle('ready', compareItems[0] && compareItems[1]);
}

function openCompareView() {
  if (!compareItems[0] || !compareItems[1]) return;
  const p1 = products.find(x => x.id === compareItems[0]);
  const p2 = products.find(x => x.id === compareItems[1]);
  if (!p1 || !p2) return;

  function colHTML(p, other) {
    let imgHTML;
    if (!p.image) imgHTML = `<div class="compare-col-img-placeholder">📦</div>`;
    else if (p.image.type === 'emoji') imgHTML = `<div class="compare-col-img-placeholder">${p.image.value}</div>`;
    else imgHTML = `<img class="compare-col-img" src="${p.image.value}" alt="${escHtml(p.name)}" onerror="this.outerHTML='<div class=\\'compare-col-img-placeholder\\'>📦</div>'">`;

    const cheaper = p.price && other.price && p.price <= other.price;
    const winnerBadge = cheaper ? `<span class="compare-winner">💰 較便宜</span>` : '';

    const tags = (p.tags||[]).join(', ') || '—';
    const note = p.note || '—';
    const dateStr = new Date(p.createdAt).toLocaleDateString('zh-TW');

    return `<div class="compare-col">
      ${imgHTML}
      <div class="compare-col-body">
        ${winnerBadge}
        <div class="compare-col-name">${escHtml(p.name)}</div>
        <div class="compare-col-price">${p.price ? '$'+Number(p.price).toLocaleString() : '—'}</div>
        <div class="compare-row"><div class="compare-row-label">標籤</div><div class="compare-row-val">${escHtml(tags)}</div></div>
        <div class="compare-row"><div class="compare-row-label">記錄日</div><div class="compare-row-val">${dateStr}</div></div>
        <div class="compare-row"><div class="compare-row-label">備註</div><div class="compare-row-val">${escHtml(note)}</div></div>
      </div>
    </div>`;
  }

  document.getElementById('compareContent').innerHTML = `
    <div class="compare-cols">
      ${colHTML(p1, p2)}
      ${colHTML(p2, p1)}
    </div>`;

  openModal('compareModal');
}

// ── DRAG ──────────────────────────────────────────────────────────────────────
function dragStart(e, id) {
  if (!compareMode) return;
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.classList.add('dragging');
}
function dragEnd(e) {
  e.currentTarget.classList.remove('dragging');
}

// ── MODAL HELPERS ─────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
renderGrid();
</script>
</body>
</html>
